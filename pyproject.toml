[project]
name = "rentright"
version = "0.1.0"
description = "RentRight is a smart rental management platform that streamlines property listings, tenant management, and rental operations."
readme = "README.md"
authors = [
    { name = "Nethra", email = "nethrasaran267@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",
    "pre-commit",
    "pytest",
    "ruff",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Harmless notice from newer Starlette versions; hide it so real warnings stand out.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
